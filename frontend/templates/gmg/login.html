{% extends "gmg/auth.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="sub">Access your {{ brand.product }} workspace.</p>

<form method="post" action="/login">
  <input type="hidden" name="next" value="{{ next or '/market' }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="field">
    <label for="email">Email address</label>
    <input id="email" type="email" name="email" value="{{ form.email or '' }}"
           autocomplete="email" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
  </div>
  <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
</form>

{% if unverified %}
<form method="post" action="/verify/resend" class="mt-16">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="email" value="{{ form.email or '' }}">
  <button class="btn btn-block btn-sm" type="submit">Send me a new verification link</button>
</form>
{% endif %}
{% endblock %}

{% block foot %}
<a href="/forgot-password">Forgot your password?</a><br>
<span class="mt-8" style="display:inline-block">
  New to GMG? <a href="/signup">Create an account</a>
</span>
{% endblock %}
