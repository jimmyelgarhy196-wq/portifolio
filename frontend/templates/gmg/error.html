<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · {{ brand.short }}</title>
  <link rel="stylesheet" href="/static/css/gmg.css">
</head>
<body>
<div class="auth-shell">
  <div style="text-align:center;max-width:520px">
    <div class="gmg-mark lg" style="margin:0 auto 22px">GMG</div>
    <h1 style="font-size:56px;margin-bottom:4px;color:var(--gold)">{{ code }}</h1>
    <p class="dim" style="font-size:15px">{{ message }}</p>
    <div class="row mt-24" style="justify-content:center">
      <a class="btn btn-primary" href="/">Go to the homepage</a>
      <a class="btn btn-ghost" href="/market">Open the platform</a>

  </div>
</div>
</body>
</html>
