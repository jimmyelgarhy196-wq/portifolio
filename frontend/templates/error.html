{% extends "base.html" %}
{% block title %}{{ code }} — EGX ALPHA{% endblock %}
{% block content %}
<div class="panel">
  <div class="panel-header"><span class="panel-title">Error {{ code }}</span></div>
  <div class="panel-body">
    <div class="empty-state">
      <div class="title">{{ code }}</div>
      <div class="hint">{{ message }}</div>
      <div style="margin-top:18px"><a href="/" class="btn">Return to dashboard</a></div>
    </div>
  </div>
</div>
{% endblock %}
