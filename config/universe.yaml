# =============================================================================
# GMG Investment Intelligence — Investable universe (EGX-listed equities)
# =============================================================================
# IMPORTANT — READ THIS BEFORE TRUSTING THIS FILE
#
# This file is a SEED of reference data only: ticker, company name, sector and
# index membership. It contains NO prices, NO ratios and NO financials — those
# are ingested from data providers and are never stored here.
#
# `verified: false` means this seed was compiled from general knowledge and has
# NOT been reconciled against an official Egyptian Exchange constituent list.
# Index membership (EGX30 / EGX70 / EGX100) is reviewed by EGX periodically and
# changes over time; sector labels may also differ from EGX's own taxonomy.
#
# Before relying on this universe:
#   1. Download the current constituent lists from https://www.egx.com.eg
#   2. Run:  python scripts/refresh_universe.py --from-csv <file>
#   3. Set `verified: true` and record the date below.
#
# The application surfaces an "UNVERIFIED UNIVERSE" notice while this is false.
# =============================================================================
meta:
  verified: false
  as_of: null
  source: "seed:general-knowledge"
  note: >-
    Reference seed only. Reconcile against the official EGX constituent lists
    before using index membership for screening or benchmarking.

benchmarks:
  # EGX30 price index. Yahoo Finance carries it as ^CCSI (formerly CASE30).
  - ticker: EGX30
    name: EGX 30 Index
    provider_symbols:
      yahoo: "^CCSI"
    is_benchmark: true
  - ticker: EGX70
    name: EGX 70 EWI Index
    provider_symbols: {}
    is_benchmark: true

