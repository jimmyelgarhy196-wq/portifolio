# GMG Investment Intelligence — nginx reverse proxy
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gmg
#   sudo ln -s /etc/nginx/sites-available/gmg /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d your-domain
#   sudo nginx -t && sudo systemctl reload nginx

upstream gmg {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limit at the edge as well as in the app: the app's limiter is
# per-process and resets on restart, so an edge limit is what survives a deploy.
limit_req_zone $binary_remote_addr zone=gmg_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain www.your-domain;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain www.your-domain;

    ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # The application loads no third-party scripts, fonts, frames or analytics,
    # so the policy can be this tight. 'unsafe-inline' covers the few inline
    # blocks the templates use to bootstrap charts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 2m;

    # Sign-in, sign-up, reset and contact: limited harder than everything else.
    location ~ ^/(login|signup|forgot-password|reset-password|contact)$ {
        limit_req zone=gmg_auth burst=10 nodelay;
        proxy_pass http://gmg;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location /static/ {
        proxy_pass http://gmg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://gmg;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app keys rate limiting and account lockout off this header.
        # Without it every request appears to come from the proxy itself.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
